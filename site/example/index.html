 are never public API.\n- **Model:** new `UnitKind`s `testSuite`, `test` and `testHook`, plus `isTestKind`. The additions are additive, so the schema version is unchanged, as with earlier additions.\n- **Names:** a test's qualified name joins titles with ` › `. A retitled test with the same body counts as a rename, because the title's text is masked like a function name.\n- **Reading order:** tests are read as code, in file order with their helpers. They're never callees in the file's call graph, and the review plan counts them as test code.\n- **`Definition.wholeSnapshot`** is the unit with nested units written out. `compareUnits` uses it for unpaired units. Breaking-change detection identifies definitions by snapshot object, so it maps both snapshots.\n\n## Not covered\n\n- Tests are matched by name, so a custom wrapper such as `myTest(\"…\", fn)` stays in \"imports & top level\", and a function of one's own named `describe` would be taken for a suite. The README says so.\n- Python (pytest functions, unittest classes) and Rust (`#[test]` functions) were already units, so they're unchanged.\n\n## Testing\n\n- Lint, typecheck, all 1,135 tests and the UI build pass.\n- New tests:\n  - nesting, hooks, `.each`, `.skipIf` and `.todo`, Playwright, and duplicate titles\n  - locals staying in their suite, and non-test calls\n  - tests not being public API, and a retitle counted as a rename\n  - a new suite shown whole, and a test added to an existing suite listed on its own\n- Reports for #55 and #57 were built with this branch and checked in the browser: the cards, the file map, and line numbers on whole units.\n","author":"navasvarela","baseRef":"main","headRef":"feat/test-callback-units","baseSha":"f950d711b99f7f742d2840aed2eddcdb029f6e4b","headSha":"4c2cdc67c24e92f30b95b20543c60228e7b343dd","mergeBaseSha":"f950d711b99f7f742d2840aed2eddcdb029f6e4b"},"files":[{"diff":{"path":"README.md","additions":6,"deletions":3,"content":{"kind":"text","hunks":[{"oldStart":17,"oldLine eferences":2}},{"kind":"function","name":"compareUnits","qualifiedName":"compareUnits","change":{"kind":"modified","weight":"semantic","before":{"startLine":47,"endLine":101,"text":"/**\n * Compares unit versions across all files of a change. Outline:\n * 1. Per file, pair definitions by key; a pair whose own tokens differ is \"modified\".\n * 2. Unpaired definitions become added/removed candidates, topmost only (a new class\n *    is reported once, not once per method).\n * 3. Across candidates, an added/removed pair with the same body under a new name in\n *    the same container is a rename; the same body anywhere else is a move.\n * 4. Of the rest, a pair of the same kind and name whose bodies are alike is a move with\n *    edits. The most alike pairs are taken first, so three similar `parse`s can't steal\n *    each other's match.\n * 5. Remaining candidates are reported as added or removed.\n */\nexport function compareUnits(files: readonly FileVersions[]): Map\u003cstring, ComparedUnit[]> {\n  const unitsByPath = new Map\u003cstring, ComparedUnit[]>(files.map((file) => [file.path, []]))\n  const report: Report = (path, unit) => {\n    unitsByPath.get(path)?.push(unit)\n  }\n  const added: Located[] = []\n  const removed: Located[] = []\n\n  for (const file of files) {\n    const moduleScopeChange = compareModuleScopes(file.before?.moduleScope, file.after?.moduleScope)\n    if (moduleScopeChange !== undefined) {\n      report(file.path, moduleScopeChange)\n    }\n    const pairing = pairDefinitions(file)\n    pairing.modified.forEach((unit) => report(file.path, unit))\n    added.push(...pairing.added.map((definition) => ({ path: file.path, definition })))\n    removed.push(...pairing.removed.map((definition) => ({ path: file.path, definition })))\n  }\n\n  for (const [from, to] of takeMatches(removed, added, isRename)) {\n    report(to.path, {\n      ...describe(to.definition),\n      change: { kind: UnitChangeKind.Renamed, previousName: from.definition.name, before: from.definition.snapshot, after: to.definition.snapshot },\n    })\n  }\n  for (const [from, to] of takeMatches(removed, added, isMove)) {\n    reportMove(report, from, to, MoveEdits.None)\n  }\n  for (const [from, to] of takeMostAlike(removed, added)) {\n    reportMove(report, from, to, differsOnlyInVisibility(from.definition, to.definition) ? MoveEdits.None : MoveEdits.Code)\n  }\n  for (const { path, definition } of added) {\n    report(path, { ...describe(definition), change: { kind: UnitChangeKind.Added, after: definition.snapshot } })\n  }\n  for (const { path, definition } of removed) {\n    report(path, { ...describe(definition), change: { kind: UnitChangeKind.Removed, before: definition.snapshot } })\n  }\n\n  for (const units of unitsByPath.values()) {\n    units.sort(byPositionInFile)\n  }\n  return unitsByPath\n}","elidesNestedUnits":false},"after":{"startLine":47,"endLine":101,"text":"/**\n * Compares unit versions across all files of a change. Outline:\n * 1. Per file, pair definitions by key; a pair whose own tokens differ is \"modified\".\n * 2. Unpaired definitions become added/removed candidates, topmost only (a new class\n *    is reported once, not once per method).\n * 3. Across candidates, an added/removed pair with the same body under a new name in\n *    the same container is a rename; the same body anywhere else is a move.\n * 4. Of the rest, a pair of the same kind and name whose bodies are alike is a move with\n *    edits. The most alike pairs are taken first, so three similar `parse`s can't steal\n *    each other's match.\n * 5. Remaining candidates are reported as added or removed.\n */\nexport function compareUnits(files: readonly FileVersions[]): Map\u003cstring, ComparedUnit[]> {\n  const unitsByPath = new Map\u003cstring, ComparedUnit[]>(files.map((file) => [file.path, []]))\n  const report: Report = (path, unit) => {\n    unitsByPath.get(path)?.push(unit)\n  }\n  const added: Located[] = []\n  const removed: Located[] = [
