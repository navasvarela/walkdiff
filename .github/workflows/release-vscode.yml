name: Release the VS Code extension

# Publishes the VS Code extension when an extension tag such as `vscode-v0.3.0` is pushed:
#
# - to the VS Code Marketplace, signed in with a Microsoft Entra identity that trusts this workflow
#   through OIDC, so no Marketplace token is stored anywhere;
# - to Open VSX, which Cursor, VSCodium and other forks install from, when its token is set;
# - as a GitHub release with the .vsix attached, for installing by hand.
#
# Set the identity up once; see docs/releasing.md. The npm release (release.yml) only starts from
# tags like `v0.14.0`, so the two never start each other.
on:
  push:
    tags: ["vscode-v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

# One run per tag at a time, and a run that's publishing is never cancelled halfway.
concurrency:
  group: release-vscode-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # A GitHub environment, so publishing can require an approval and the Entra identity can trust
    # only this job.
    environment: vscode
    permissions:
      contents: read
      # To sign in to Microsoft Entra through OIDC, as the identity the Marketplace publisher trusts.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          # A release is built from the lockfile alone, never from a cache another run could have filled.
          package-manager-cache: false
      - run: corepack enable
      # Scanners aren't needed to build or test, and install scripts have no place in a release job.
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Check the tag matches the version
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p "require('./packages/vscode/package.json').version")"
          if [ "vscode-v$version" != "$TAG" ]; then echo "Tag $TAG doesn't match the extension's version $version"; exit 1; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # The extension's panel is built from the report UI, so that's built first.
      - run: pnpm build:ui
      - run: pnpm --filter walkdiff-vscode package
      - name: Sign in to Microsoft Entra
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.VSCODE_MARKETPLACE_CLIENT_ID }}
          tenant-id: ${{ vars.VSCODE_MARKETPLACE_TENANT_ID }}
          # The identity only needs to be a member of the Marketplace publisher, not of any Azure subscription.
          allow-no-subscriptions: true
      - name: Publish to the VS Code Marketplace
        working-directory: packages/vscode
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: node_modules/.bin/vsce publish --azure-credential --packagePath "walkdiff-vscode-$VERSION.vsix"
      # Open VSX takes a token, kept as a secret of the `vscode` environment. Without one, the
      # extension is published to the Marketplace only, and Open VSX can be updated by hand.
      - name: Publish to Open VSX
        working-directory: packages/vscode
        env:
          VERSION: ${{ steps.version.outputs.version }}
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "$OVSX_PAT" ]; then echo "No OVSX_PAT secret in the vscode environment; skipping Open VSX."; exit 0; fi
          node_modules/.bin/ovsx publish "walkdiff-vscode-$VERSION.vsix"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: vsix
          path: packages/vscode/walkdiff-vscode-${{ steps.version.outputs.version }}.vsix
          retention-days: 7

  # A separate job, so the one that can write to the repository can't publish, and the one that
  # publishes can't write to the repository. It runs only once the Marketplace has the extension.
  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      # To create the GitHub release and attach the .vsix.
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vsix
          path: ${{ runner.temp }}/vsix
      # A release someone already wrote by hand keeps its notes; the .vsix is attached either way.
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          vsix="$(ls "$RUNNER_TEMP"/vsix/*.vsix)"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" "$vsix" --repo "$GITHUB_REPOSITORY" --clobber
            exit 0
          fi
          version="${TAG#vscode-v}"
          printf '%s\n\n%s\n' \
            "Walkdiff for VS Code $version, on the [VS Code Marketplace](https://marketplace.visualstudio.com/items?itemName=navasvarela.walkdiff-vscode)." \
            "To install it in an editor that can't reach the Marketplace, download the .vsix below and run \`code --install-extension walkdiff-vscode-$version.vsix\`, or use Install from VSIX in the Extensions view." \
            > "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" "$vsix" --repo "$GITHUB_REPOSITORY" --verify-tag --latest=false --title "Walkdiff for VS Code $version" --notes-file "$RUNNER_TEMP/notes.md"
