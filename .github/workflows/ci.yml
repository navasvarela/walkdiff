name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      # The install only warns when a scanner fails, so people aren't blocked. CI should be.
      - name: Check the pinned scanners installed
        run: |
          cd "$HOME/.cache/walkdiff/scanners/bin"
          ./gitleaks version
          ./osv-scanner --version
          ./semgrep --version
          # Semgrep runs with newer versions of some packages than it pins (semgrep-overrides.txt), so
          # check a scan still works through both its native CLI and the Python one it falls back to.
          printf 'rules:\n- id: smoke\n  pattern: eval(...)\n  message: smoke\n  languages: [python]\n  severity: ERROR\n' > "$RUNNER_TEMP/smoke.yml"
          printf 'eval(input())\n' > "$RUNNER_TEMP/smoke.py"
          ./semgrep scan --metrics=off --disable-version-check --quiet --json --config "$RUNNER_TEMP/smoke.yml" "$RUNNER_TEMP/smoke.py" | grep -q '"check_id": *"[^"]*smoke"'
          ./semgrep --legacy scan --metrics=off --disable-version-check --quiet --json --config "$RUNNER_TEMP/smoke.yml" "$RUNNER_TEMP/smoke.py" | grep -q '"check_id": *"[^"]*smoke"'
          ./ruff --version
          ./zizmor --version
          ./poutine version
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build:ui
      - run: pnpm build:vscode
      # The oldest Neovim the plugin supports, pinned by checksum.
      - name: Install Neovim 0.10.4
        run: |
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/nvim.tar.gz" https://github.com/neovim/neovim/releases/download/v0.10.4/nvim-linux-x86_64.tar.gz
          echo "95aaa8e89473f5421114f2787c13ae0ec6e11ebbd1a13a1bd6fcf63420f8073f  $RUNNER_TEMP/nvim.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/nvim.tar.gz" -C "$RUNNER_TEMP"
      - name: Test the Neovim plugin
        run: '"$RUNNER_TEMP/nvim-linux-x86_64/bin/nvim" --headless -l packages/nvim/tests/run.lua'
