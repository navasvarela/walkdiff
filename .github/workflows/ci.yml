name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      # The install only warns when a scanner fails, so people aren't blocked. CI should be.
      - name: Check the pinned scanners installed
        run: |
          cd "$HOME/.cache/walkdiff/scanners/bin"
          ./gitleaks version
          ./osv-scanner --version
          ./semgrep --version
          # Semgrep runs with newer versions of some packages than it pins (semgrep-overrides.txt), so
          # check a scan still works through both its native CLI and the Python one it falls back to.
          printf 'rules:\n- id: smoke\n  pattern: eval(...)\n  message: smoke\n  languages: [python]\n  severity: ERROR\n' > "$RUNNER_TEMP/smoke.yml"
          printf 'eval(input())\n' > "$RUNNER_TEMP/smoke.py"
          ./semgrep scan --metrics=off --disable-version-check --quiet --json --config "$RUNNER_TEMP/smoke.yml" "$RUNNER_TEMP/smoke.py" | grep -q '"check_id": *"[^"]*smoke"'
          ./semgrep --legacy scan --metrics=off --disable-version-check --quiet --json --config "$RUNNER_TEMP/smoke.yml" "$RUNNER_TEMP/smoke.py" | grep -q '"check_id": *"[^"]*smoke"'
          ./ruff --version
          ./zizmor --version
          ./poutine version
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build:ui
