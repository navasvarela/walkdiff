name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      # The install only warns when a scanner fails, so people aren't blocked. CI should be.
      - name: Check the pinned scanners installed
        run: |
          cd "$HOME/.cache/walkdiff/scanners/bin"
          ./gitleaks version
          ./osv-scanner --version
          ./semgrep --version
          ./ruff --version
          ./zizmor --version
          ./poutine version
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build:ui
